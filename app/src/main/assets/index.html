<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Grave Digger RC</title>
<style>
  :root {
    --bg: #0b0f14; --panel: #151c26; --line: #243042; --txt: #e6edf6; --mut: #8a97ab;
    --blue: #3ea6ff; --amber: #ffb347; --red: #e5484d; --green: #2f9e6b; --btn: #1b2430;
  }
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt); font-family: system-ui, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; padding: 10px 16px 12px; gap: 8px; }

  .top { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--mut); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); flex: none; }
  .dot.ok { background: var(--green); }
  #status { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #rx { max-width: 30%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .main { flex: 1; min-height: 0; display: flex; gap: 12px; }
  .zone { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  .track { position: relative; background: var(--panel); border: 2px solid var(--line); }
  .track.v { width: 96px; height: min(64vh, 280px); border-radius: 48px; }
  .track.h { height: 96px; width: min(30vw, 280px); border-radius: 48px; }
  .track::after { content: ""; position: absolute; background: var(--line); }
  .track.v::after { left: 14px; right: 14px; top: 50%; height: 1px; }
  .track.h::after { top: 14px; bottom: 14px; left: 50%; width: 1px; }
  .knob { position: absolute; width: 76px; height: 76px; border-radius: 50%; left: 50%; top: 50%; margin: -38px 0 0 -38px; }
  .knob.speed { background: var(--blue); }
  .knob.steer { background: var(--amber); }
  .cap { font-size: 12px; letter-spacing: .08em; color: var(--mut); }

  .center { width: 220px; flex: none; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
  .tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tier { background: var(--btn); border: 1px solid var(--line); border-radius: 12px; padding: 10px 4px; text-align: center; font-size: 13px; font-weight: 800; color: var(--mut); }
  .tier.active { background: var(--blue); border-color: var(--blue); color: #081018; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .aux { background: var(--btn); border: 1px solid var(--line); border-radius: 14px; padding: 16px 6px; text-align: center; font-size: 13px; font-weight: 700; color: var(--mut); }
  .aux.on { background: var(--green); border-color: var(--green); color: #fff; }
  .stop { background: var(--red); border-radius: 14px; padding: 16px 6px; text-align: center; font-size: 20px; font-weight: 900; letter-spacing: .04em; color: #fff; }
  .stop.rearm { background: var(--green); font-size: 14px; }
</style>
</head>
<body>
  <div class="top">
    <span class="dot" id="dot"></span>
    <span id="status">Initialisation…</span>
    <span id="rx"></span>
  </div>

  <div class="main">
    <div class="zone" id="zoneSpeed">
      <div class="track v" id="trackSpeed"><div class="knob speed" id="knobSpeed"></div></div>
      <span class="cap" id="capSpeed">VITESSE 0 (P1)</span>
    </div>

    <div class="center">
      <div class="tiers" id="tiers">
        <div class="tier" data-tier="1">P1</div>
        <div class="tier" data-tier="2">P2</div>
        <div class="tier" data-tier="3">P3</div>
      </div>
      <div class="grid" id="grid"></div>
      <div class="stop" id="stop">STOP</div>
    </div>

    <div class="zone" id="zoneSteer">
      <div class="track h" id="trackSteer"><div class="knob steer" id="knobSteer"></div></div>
      <span class="cap" id="capSteer">DIRECTION 0</span>
    </div>
  </div>

<script>
  // ===================== ZONE AJUSTABLE PAR L'UTILISATEUR =====================
  const SEND_INTERVAL_MS = 25;   // 25 ms = 40 trames/s
  const DEADZONE = 0.04;         // zone morte tactile (0..1)
  const INVERT_SPEED = false;    // inverse le joystick de vitesse
  const INVERT_STEER = false;    // inverse le joystick de direction
  const REARM_HOLD_MS = 600;     // appui long pour réarmer après STOP
  const DEFAULT_TIER = 1;        // palier initial : 1, 2 ou 3
  // Ratio P3 / P2 = 1.00 / 0.65 ≈ 1.54 (>= 1.5)
  const SPEED_TIERS = {
    1: 0.45,
    2: 0.65,
    3: 1.00
  };
  const BUTTONS = [
    { label: 'B1 / AUX',     mode: 'momentary' },
    { label: 'B2 / BOOST', mode: 'momentary' },
    { label: 'B3 / PRESET',  mode: 'momentary' },
    { label: 'B4 / CAPTEUR', mode: 'momentary' }
  ];
  // =================== FIN DE LA ZONE AJUSTABLE ===================

  let throttle = 0;        // -1..1
  let steer = 0;           // -1..1
  let mask = 0;            // bits des boutons
  let armed = true;
  let speedTier = DEFAULT_TIER;

  const $ = (id) => document.getElementById(id);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const shape = (v, invert) => {
    const a = Math.abs(v);
    const s = a <= DEADZONE ? 0 : (a - DEADZONE) / (1 - DEADZONE);
    const o = Math.sign(v) * s;
    return invert ? -o : o;
  };

  // ---------- Paliers de vitesse (1, 2, 3) ----------
  const tierEls = Array.from(document.querySelectorAll('.tier'));
  function paintTiers() {
    tierEls.forEach(function (el) {
      el.classList.toggle('active', Number(el.dataset.tier) === speedTier);
    });
  }
  function setSpeedTier(t) {
    if (!armed || !SPEED_TIERS[t]) return;
    speedTier = t;
    paintTiers();
    send();
  }
  tierEls.forEach(function (el) {
    el.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      setSpeedTier(Number(el.dataset.tier));
    });
  });

  // ---------- Envoi ----------
  function frame() {
    const mult = armed ? (SPEED_TIERS[speedTier] ?? 1) : 0;
    const s = armed ? Math.round(clamp(throttle * mult * 100, -100, 100)) : 0;
    const t = armed ? Math.round(clamp(steer * 100, -100, 100)) : 0;
    const m = armed ? mask : 0;
    let bits = '';
    for (let i = 0; i < 4; i++) bits += ((m >> i) & 1);
    return { text: 'T:' + s + ',S:' + t + ',B:' + bits, s: s, t: t };
  }

  let lastS = null, lastT = null, lastTier = null;
  function send() {
    const f = frame();
    if (window.AndroidBridge && typeof window.AndroidBridge.sendUdp === 'function') {
      window.AndroidBridge.sendUdp(f.text);
    }
    if (f.s !== lastS || speedTier !== lastTier) {
      lastS = f.s;
      lastTier = speedTier;
      $('capSpeed').textContent = 'VITESSE ' + f.s + ' (P' + speedTier + ')';
    }
    if (f.t !== lastT) {
      lastT = f.t;
      $('capSteer').textContent = 'DIRECTION ' + f.t;
    }
  }
  setInterval(send, SEND_INTERVAL_MS);

  // ---------- Joysticks ----------
  function makeStick(zone, track, knob, axis, onValue) {
    let id = null, ox = 0, oy = 0, travel = 1;
    function setPos(v) {
      const px = v * travel;
      knob.style.transform = axis === 'y' ? 'translateY(' + (-px) + 'px)' : 'translateX(' + px + 'px)';
    }
    function reset() { id = null; setPos(0); onValue(0); }
    zone.addEventListener('pointerdown', function (e) {
      if (!armed || id !== null) return;
      id = e.pointerId;
      zone.setPointerCapture(id);
      ox = e.clientX; oy = e.clientY;
      const r = track.getBoundingClientRect();
      travel = Math.max(1, ((axis === 'y' ? r.height : r.width) - knob.offsetWidth) / 2 - 2);
    });
    zone.addEventListener('pointermove', function (e) {
      if (e.pointerId !== id) return;
      const d = axis === 'y' ? (oy - e.clientY) : (e.clientX - ox);
      const v = clamp(d / travel, -1, 1);
      setPos(v);
      onValue(v);
    });
    const end = function (e) { if (e.pointerId === id) { reset(); send(); } };
    zone.addEventListener('pointerup', end);
    zone.addEventListener('pointercancel', end);
    return { reset: reset };
  }

  const stickSpeed = makeStick($('zoneSpeed'), $('trackSpeed'), $('knobSpeed'), 'y',
    function (v) { throttle = shape(v, INVERT_SPEED); });
  const stickSteer = makeStick($('zoneSteer'), $('trackSteer'), $('knobSteer'), 'x',
    function (v) { steer = shape(v, INVERT_STEER); });

  // ---------- 4 boutons ----------
  const btnEls = [];
  function paintButtons() {
    btnEls.forEach(function (el, i) { el.classList.toggle('on', ((mask >> i) & 1) === 1); });
  }
  BUTTONS.forEach(function (b, i) {
    const el = document.createElement('div');
    el.className = 'aux';
    el.textContent = b.label;
    el.addEventListener('pointerdown', function (e) {
      if (!armed) return;
      el.setPointerCapture(e.pointerId);
      if (b.mode === 'toggle') mask ^= (1 << i); else mask |= (1 << i);
      paintButtons(); send();
    });
    const up = function () {
      if (b.mode === 'momentary') { mask &= ~(1 << i); paintButtons(); send(); }
    };
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    $('grid').appendChild(el);
    btnEls.push(el);
  });

  // ---------- STOP / réarmement ----------
  let holdTimer = null;
  function paintStop() {
    const el = $('stop');
    el.classList.toggle('rearm', !armed);
    el.textContent = armed ? 'STOP' : 'MAINTENIR POUR RÉARMER';
  }
  function disarm() {
    armed = false;
    throttle = 0; steer = 0; mask = 0; speedTier = DEFAULT_TIER;
    stickSpeed.reset(); stickSteer.reset();
    paintTiers(); paintButtons(); paintStop(); send();
  }
  $('stop').addEventListener('pointerdown', function () {
    if (armed) { disarm(); return; }
    holdTimer = setTimeout(function () { armed = true; paintStop(); }, REARM_HOLD_MS);
  });
  const stopUp = function () { clearTimeout(holdTimer); };
  $('stop').addEventListener('pointerup', stopUp);
  $('stop').addEventListener('pointercancel', stopUp);

  // ---------- Retours de l'appli Android ----------
  window.onStatus = function (s) {
    $('status').textContent = s;
    $('dot').classList.toggle('ok', s.indexOf('Wi-Fi OK') === 0 || s.indexOf('Envoi vers') === 0);
  };
  window.onRx = function (line) { $('rx').textContent = line; };

  if (window.AndroidBridge && typeof window.AndroidBridge.getStatus === 'function') {
    window.onStatus(window.AndroidBridge.getStatus());
  } else {
    window.onStatus('Aperçu navigateur (rien n\'est envoyé)');
  }

  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  paintTiers();
  paintStop();
</script>
</body>
</html>
